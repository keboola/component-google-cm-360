[project]
name = "component-google-cm-360"
dynamic = ["version"]
requires-python = "~=3.13.0"
dependencies = [
    "keboola-component>=1.9.0",
    "keboola.utils>=1.1.0",
    "keboola.csvwriter>=1.0.1",
    "google-api-python-client>=2.119.0",
    "google-auth-oauthlib>=1.2.0",
    "requests>=2.28.1",
    "dateparser>=1.1.7",
    "beautifulsoup4>=4.12.2",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "freezegun>=1.2.2",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP"]
